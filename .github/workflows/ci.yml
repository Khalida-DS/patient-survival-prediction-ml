name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt', 'requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          flake8 src/ train_model.py \
            --max-line-length=100 \
            --ignore=E501,W503 \
            --exclude=__pycache__

      - name: Run unit tests with coverage
        run: pytest tests/ -v --tb=short --cov=src --cov-report=xml

  app-deploy-smoke-test:
    # Installs ONLY requirements.txt — the same lean, pinned file
    # Streamlit Community Cloud installs for the live demo — and loads
    # the real committed model. This is the check that would have
    # caught the original deploy failure (unpinned scikit-learn could
    # not unpickle a model saved with a different scikit-learn version).
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app (deploy) dependencies only
        run: pip install -r requirements.txt pytest

      - name: App smoke test (load model, predict, explain)
        run: pytest tests/test_app_smoke.py -v --tb=short
